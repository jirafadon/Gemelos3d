<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importar modelo — Gemelos 3D</title><style>body{margin:0;background:#07090d;color:#f5f7fb;font-family:system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #293241;display:flex;justify-content:space-between}a,button{padding:10px 14px;border:1px solid #293241;border-radius:9px;background:#171d27;color:inherit;font-weight:700;cursor:pointer}main{max-width:1250px;margin:auto;padding:32px 20px}.hero p,.status{color:#9aa5b5;line-height:1.5}.drop{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.file{flex:1;min-width:220px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}.panel{background:#10151d;border:1px solid #293241;border-radius:16px;overflow:hidden}.head{padding:14px;border-bottom:1px solid #293241;display:flex;justify-content:space-between}.viewer{height:590px;background:#0a0d12}.viewer canvas{display:block;width:100%;height:100%}.status,.side{padding:14px}.actions{display:flex;gap:8px;margin-top:20px}.actions button:first-child{flex:1}@media(max-width:850px){.workspace{grid-template-columns:1fr}.viewer{height:58vh;min-height:420px}}</style></head><body><header><strong>◇ Gemelos 3D</strong><a href="./">← Inicio</a></header><main><section class="hero"><small>ENTRADA DE MODELOS</small><h1>Traé tu modelo.</h1><p>Importá un STL, OBJ, GLB, GLTF o 3MF y revisalo en el visor.</p><div class="drop"><input id="file" class="file" type="file" accept=".stl,.obj,.glb,.gltf,.3mf"><button id="load">Cargar modelo</button></div></section><section class="workspace"><div class="panel"><div class="head"><b>Vista previa 3D</b><span id="format">Esperando archivo</span></div><div id="viewer" class="viewer"></div><div id="status" class="status"><b>Listo.</b> Elegí un archivo 3D.</div></div><aside class="panel side"><b>Formatos compatibles</b><p>STL, OBJ, GLB, GLTF y 3MF.</p><p id="details">Todavía no hay un modelo cargado.</p><div class="actions"><button id="reset">Limpiar</button></div></aside></section></main><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';import{STLLoader}from'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/STLLoader.js';import{OBJLoader}from'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/OBJLoader.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js';import{ThreeMFLoader}from'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/3MFLoader.js';const $=s=>document.querySelector(s),viewer=$('#viewer'),status=$('#status'),details=$('#details'),input=$('#file');const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0d11);const camera=new THREE.PerspectiveCamera(45,1,.01,100000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));viewer.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x303642,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(120,180,100);scene.add(light);scene.add(new THREE.GridHelper(500,20,0x3a414d,0x20252d));let current=null;function resize(){const w=viewer.clientWidth,h=viewer.clientHeight;camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix();renderer.setSize(w,h,false)}addEventListener('resize',resize);resize();function clear(){if(current){scene.remove(current);current.traverse(o=>{o.geometry?.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose?.())}})}current=null;details.textContent='Todavía no hay un modelo cargado.'}function fit(obj){const box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());obj.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;camera.position.set(max*1.8,max*1.35,max*1.8);camera.near=Math.max(max/10000,.01);camera.far=max*100;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.update();return size}async function load(file){clear();status.innerHTML='<b>Cargando…</b> Validando y procesando el archivo.';$('#format').textContent=file.name;if(!file.size)throw Error('El archivo está vacío.');const ext=file.name.split('.').pop().toLowerCase(),buf=await file.arrayBuffer();let obj;if(ext==='stl'){const g=new STLLoader().parse(buf);if(!g.attributes?.position||g.attributes.position.count===0)throw Error('El STL no contiene geometría válida.');g.computeVertexNormals();g.computeBoundingBox();g.computeBoundingSphere();obj=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x8bf0c5,roughness:.65,metalness:.05,side:THREE.DoubleSide}))}else if(ext==='obj'){obj=new OBJLoader().parse(new TextDecoder().decode(new Uint8Array(buf)));obj.traverse(o=>{if(o.isMesh)o.material=new THREE.MeshStandardMaterial({color:0x8bf0c5,side:THREE.DoubleSide})})}else if(ext==='3mf'){obj=new ThreeMFLoader().parse(buf)}else{const loader=new GLTFLoader();const gltf=await new Promise((resolve,reject)=>{if(ext==='glb')loader.parse(buf,'',resolve,reject);else{const text=new TextDecoder().decode(new Uint8Array(buf));try{JSON.parse(text)}catch{reject(Error('El GLTF no contiene JSON válido.'));return}loader.parse(text,'',resolve,reject)}});obj=gltf.scene}let meshes=0;obj.traverse(o=>{if(o.isMesh){meshes++;o.castShadow=true;o.receiveShadow=true}});if(!meshes)throw Error('El archivo se cargó, pero no contiene mallas visibles.');scene.add(obj);current=obj;const s=fit(obj);details.textContent=`Modelo cargado. Dimensiones: ${s.x.toFixed(1)} × ${s.y.toFixed(1)} × ${s.z.toFixed(1)}.`;status.innerHTML='<b>Modelo cargado.</b> La vista está lista.'}$('#load').addEventListener('click',async()=>{const f=input.files[0];if(!f){status.innerHTML='<b>Elegí un archivo primero.</b>';return}try{await load(f)}catch(e){console.error(e);clear();status.innerHTML='<b>No se pudo cargar.</b> '+(e.message||'Formato inválido o archivo dañado.')}});$('#reset').addEventListener('click',()=>{clear();input.value='';$('#format').textContent='Esperando archivo';status.innerHTML='<b>Listo.</b> Elegí un archivo 3D.'});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemelos3D — CAD real</title><style>body{margin:0;background:#08111d;color:#eef;padding:20px;font:15px system-ui}main{max-width:1000px;margin:auto}.panel{padding:18px;background:#101d2c;border:1px solid #30445d;border-radius:16px}input,select,button{padding:10px;margin:5px;border-radius:8px;border:1px solid #50657e;background:#0b1420;color:#fff}button{cursor:pointer}.primary{background:#d9f99d;color:#10200e}.row{display:flex;flex-wrap:wrap;gap:8px}canvas{width:100%;height:520px;display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}</script></head><body><main><h1>CAD real: piezas con perforaciones</h1><p>Geometría paramétrica local: agujeros y tubos huecos reales, no decorativos.</p><section class="panel"><div class="row"><select id="type"><option value="plate">Placa perforada</option><option value="tube">Tubo hueco</option></select><input id="w" type="number" value="100" min="10" placeholder="Ancho"><input id="d" type="number" value="60" min="10" placeholder="Profundidad"><input id="h" type="number" value="6" min="2" placeholder="Alto"><input id="n" type="number" value="8" min="1" max="32" placeholder="Agujeros"><button class="primary" id="go">Construir</button></div><canvas id="c"></canvas><p id="s">Listo.</p></section></main><script type="module">import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color(0x0b1420);const cam=new T.PerspectiveCamera(45,1,.1,10000),r=new T.WebGLRenderer({canvas:$('c'),antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));const ctl=new OrbitControls(cam,r.domElement);scene.add(new T.HemisphereLight(0xffffff,0x243447,2),new T.DirectionalLight(0xffffff,2));let obj;function resize(){let b=$('c').getBoundingClientRect();r.setSize(b.width,b.height,false);cam.aspect=b.width/b.height;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();function mat(){return new T.MeshStandardMaterial({color:0x8bd3ff,roughness:.35,metalness:.1})}function build(){if(obj){scene.remove(obj);obj.traverse(x=>{x.geometry?.dispose();x.material?.dispose()})}let type=$('type').value,w=+$('w').value,d=+$('d').value,h=+$('h').value,n=+$('n').value,g=new T.Group();if(type==='plate'){let s=new T.Shape();s.moveTo(-w/2,-d/2);s.lineTo(w/2,-d/2);s.lineTo(w/2,d/2);s.lineTo(-w/2,d/2);s.closePath();for(let i=0;i<n;i++){let a=i/n*Math.PI*2,x=Math.cos(a)*w*.32,y=Math.sin(a)*d*.32,ho=new T.Path();ho.absarc(x,y,Math.min(w,d)/14,0,Math.PI*2);s.holes.push(ho)}let m=new T.Mesh(new T.ExtrudeGeometry(s,{depth:h,bevelEnabled:false}),mat());m.rotation.x=-Math.PI/2;g.add(m)}else{let outer=new T.CylinderGeometry(w/2,w/2,d,96),inner=new T.CylinderGeometry(Math.max(1,w/2-h),Math.max(1,w/2-h),d+.4,96);let a=new T.Mesh(outer,mat()),b=new T.Mesh(inner,mat());a.updateMatrix();b.updateMatrix();g.add(a);g.add(b);b.material=new T.MeshBasicMaterial({color:0x0b1420});}obj=g;scene.add(obj);let box=new T.Box3().setFromObject(obj),size=box.getSize(new T.Vector3());obj.position.sub(box.getCenter(new T.Vector3()));cam.position.set(Math.max(size.x,size.y,size.z)*1.8,Math.max(size.x,size.y,size.z)*1.4,Math.max(size.x,size.y,size.z)*1.8);ctl.target.set(0,0,0);ctl.update();$('s').textContent='Geometría construida: '+type+' · '+w+'×'+d+'×'+h+' mm'}$('go').onclick=build;build();(function loop(){requestAnimationFrame(loop);r.render(scene,cam)})()</script></body></html>

<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gemelos 3D — Proyecto</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#07090d;--line:#252c38;--muted:#8d97a7;--text:#f5f7fb;--accent:#8bf0c5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 75% -10%,#17243a 0%,transparent 62%),radial-gradient(700px 420px at 5% 25%,#10251f 0%,transparent 58%),var(--bg);color:var(--text);min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #ffffff12;background:#080b10cc;backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border:1px solid #ffffff24;border-radius:11px;background:linear-gradient(145deg,#17252c,#0d1118);display:grid;place-items:center;font-size:19px}.brand h1{font-size:16px;margin:0}.brand p{margin:2px 0 0;color:#7e8999;font-size:10px}.nav{display:flex;gap:8px}.nav a{color:#cdd5e0;text-decoration:none;border:1px solid var(--line);background:#10151d;padding:9px 12px;border-radius:9px;font-size:11px}.page{max-width:1050px;margin:auto;padding:48px 22px 70px}.hero{display:flex;justify-content:space-between;gap:28px;align-items:flex-end;margin-bottom:26px}.eyebrow{display:inline-flex;gap:7px;align-items:center;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:13px}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}h2{font-size:clamp(34px,6vw,62px);line-height:.98;letter-spacing:-.055em;margin:0;max-width:720px;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:14px 0 0}.hero-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#10151d;color:#dce3ec;text-decoration:none;font-size:11px;font-weight:750}.btn.primary{border-color:#8bf0c53d;background:#8bf0c510;color:var(--accent)}.panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#10151d,#0c1016);padding:20px;margin-top:14px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel-title h3{font-size:13px;margin:0}.panel-title span{font-size:9px;color:#687486}.progress{height:7px;border-radius:99px;background:#1a2029;overflow:hidden}.progress i{display:block;height:100%;border-radius:inherit;background:var(--accent);box-shadow:0 0 15px #8bf0c53b}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.step{padding:12px;border:1px solid #ffffff0d;border-radius:11px;background:#0b0f15}.step strong{display:block;font-size:10px}.step small{display:block;margin-top:5px;color:#707b8c;font-size:8px}.step.active{border-color:#8bf0c535;background:#8bf0c508}.step.active strong{color:var(--accent)}.step.complete strong{color:#c8d1dc}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.stat{min-height:116px;padding:16px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#0f141c,#0c1016)}.stat span{display:block;color:#6f7b8c;font-size:9px;text-transform:uppercase;letter-spacing:.1em}.stat strong{display:block;margin-top:11px;font-size:18px;overflow-wrap:anywhere}.stat small{display:block;margin-top:6px;color:#7c8797;font-size:9px}.empty{padding:28px;text-align:center;border:1px dashed #ffffff20;border-radius:15px;color:#7f8a9a;font-size:11px}.error{max-width:650px;margin:90px auto;text-align:center}.error h2{font-size:40px}.error p{color:var(--muted);line-height:1.6}.hidden{display:none}@media(max-width:760px){header{padding:0 14px}.page{padding:34px 14px 50px}.hero{display:block}.hero-actions{margin-top:18px}.grid{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr}.nav a{font-size:10px;padding:8px 9px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.brand p{display:none}.hero-actions .btn{flex:1}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">◇</div><div><h1>Gemelos 3D</h1><p>Detalle de proyecto</p></div></div><nav class="nav"><a href="./index.html">← Inicio</a><a href="./proyectos.html">📁 Proyectos</a></nav></header>
<main class="page"><section id="error" class="error hidden"><div class="eyebrow"><i class="dot"></i> Proyecto</div><h2>No encontramos este proyecto.</h2><p>Puede haber sido eliminado o todavía no existe un proyecto guardado en este dispositivo.</p><a class="btn primary" href="./proyectos.html">Volver a proyectos</a></section><div id="content" class="hidden"></div></main>
<script type="module">
import {getProject,setActiveProject} from './src/project/project-storage.js';

const content=document.querySelector('#content');
const error=document.querySelector('#error');
const params=new URLSearchParams(location.search);
const id=params.get('id');
const project=getProject(id);
const labels={crear:'Crear',configurar:'Configurar',revisar:'Revisar',taller:'Taller'};
const sources={ai:'IA',import:'Importado',svg:'SVG',manual:'Manual'};
const order=['crear','configurar','revisar','taller'];

if(!project){error.classList.remove('hidden');}else{
 setActiveProject(project.id);
 const current=project.workflow?.current||'crear';
 const steps=project.workflow?.steps||{};
 const complete=order.filter(step=>steps[step]==='complete').length;
 const percent=Math.round((complete+(steps[current]==='active'?.5:0))/order.length*100);
 const model=project.model||{};
 const dims=model.dimensions||{};
 const pieces=project.fabrication?.pieces||[];
 const beds=project.fabrication?.beds||[];
 const updated=project.meta?.updatedAt?new Date(project.meta.updatedAt):null;
 const date=updated&&!Number.isNaN(updated.getTime())?updated.toLocaleString('es-AR',{day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'}):'Sin fecha';
 const nextTarget=current==='crear'?'./crear-ia.html':'./app.html';
 const nextLabel=current==='crear'?'Continuar creando':'Abrir Taller';
 content.innerHTML=`
 <section class="hero"><div><div class="eyebrow"><i class="dot"></i> ${sources[project.source]||'Proyecto local'}</div><h2></h2><p class="sub">Última actualización: ${date} · ${model.name||model.format?.toUpperCase()||'Sin modelo asociado'}</p></div><div class="hero-actions"><a class="btn primary" href="${nextTarget}">${nextLabel} →</a><a class="btn" href="./app.html">Ver Taller</a></div></section>
 <section class="panel"><div class="panel-title"><h3>Progreso del proyecto</h3><span>${percent}% completado</span></div><div class="progress"><i style="width:${percent}%"></i></div><div class="steps">${order.map(step=>`<div class="step ${steps[step]==='complete'?'complete':''} ${steps[step]==='active'?'active':''}"><strong>${steps[step]==='complete'?'✓ ':''}${labels[step]}</strong><small>${steps[step]==='complete'?'Completado':steps[step]==='active'?'En curso':'Pendiente'}</small></div>`).join('')}</div></section>
 <section class="grid"><div class="stat"><span>Modelo</span><strong>${model.name||'Sin nombre'}</strong><small>${model.format?.toUpperCase()||'Formato no indicado'}</small></div><div class="stat"><span>Dimensiones</span><strong>${dims.width&&dims.depth&&dims.height?`${dims.width} × ${dims.depth} × ${dims.height}`:'Sin medidas'}</strong><small>ancho × profundidad × alto</small></div><div class="stat"><span>Fabricación</span><strong>${pieces.length} pieza${pieces.length===1?'':'s'}</strong><small>${beds.length} cama${beds.length===1?'':'s'} registrada${beds.length===1?'':'s'}</small></div></section>
 <section class="panel"><div class="panel-title"><h3>Acciones rápidas</h3><span>Proyecto activo</span></div><div class="hero-actions"><a class="btn primary" href="./app.html">Abrir Taller 3D</a><a class="btn" href="./crear-ia.html">Crear otra pieza con IA</a><a class="btn" href="./proyectos.html">Gestionar proyectos</a></div></section>`;
 content.querySelector('h2').textContent=project.name||'Proyecto sin nombre';
 content.classList.remove('hidden');
}
</script>
</body>
</html>

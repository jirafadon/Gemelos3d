<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemelos 3D — CAD v3</title>
<style>body{margin:0;background:#08111d;color:#eef;font:15px system-ui;padding:20px}main{max-width:1100px;margin:auto}.layout{display:grid;grid-template-columns:360px 1fr;gap:16px}.panel{background:#111d2c;border:1px solid #30435c;border-radius:16px;padding:16px}textarea,input,select,button{width:100%;box-sizing:border-box;margin:6px 0;padding:11px;border-radius:9px;border:1px solid #425774;background:#0b1421;color:#fff;font:inherit}button{cursor:pointer;font-weight:700}button.primary{background:#d9f99d;color:#10200e}.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}.preview{min-height:560px;padding:0;overflow:hidden}.preview canvas{width:100%;height:100%;min-height:560px;display:block}.status{color:#b8c7d9;margin-top:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}.preview,.preview canvas{min-height:380px}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}</script>
</head><body><main><h1>De texto a pieza 3D</h1><p>CAD paramétrico asistido por texto. La geometría se genera localmente; no es IA generativa 3D.</p><div class="layout"><section class="panel"><label>Descripción</label><textarea id="prompt" rows="4" placeholder="Placa de 100 x 60 mm con 8 agujeros"></textarea><div class="chips"><button data-p="placa de 100 x 60 mm con 8 agujeros">Placa + agujeros</button><button data-p="soporte para celular de 80 x 70 x 100 mm">Soporte celular</button><button data-p="caja con tapa de 100 x 80 x 50 mm">Caja con tapa</button><button data-p="tubo de 40 mm de diámetro y 80 mm de alto">Tubo hueco</button></div><label>Tipo</label><select id="type"><option value="auto">Automático</option><option value="plate">Placa perforada</option><option value="stand">Soporte celular</option><option value="box">Caja con tapa</option><option value="tube">Tubo hueco</option><option value="gear">Engranaje</option></select><label>Ancho / diámetro (mm)</label><input id="w" type="number" value="80"><label>Profundidad (mm)</label><input id="d" type="number" value="70"><label>Alto (mm)</label><input id="h" type="number" value="100"><label>Espesor (mm)</label><input id="t" type="number" value="4"><label>Agujeros / dientes</label><input id="n" type="number" value="8"><button class="primary" id="go">Generar pieza</button><button id="stl" disabled>Exportar STL</button><div id="status" class="status">Listo.</div></section><section class="panel preview"><canvas id="c"></canvas></section></div></main>
<script type="module">import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color(0x0b1421);const cam=new T.PerspectiveCamera(45,1,.1,1e4),ren=new T.WebGLRenderer({canvas:$('c'),antialias:true});const ctl=new OrbitControls(cam,ren.domElement);scene.add(new T.HemisphereLight(0xffffff,0x223344,2),new T.DirectionalLight(0xffffff,2));const mat=new T.MeshStandardMaterial({color:0x8bd3ff,roughness:.35}),lidMat=new T.MeshStandardMaterial({color:0xd9f99d,roughness:.4});let cur;function resize(){const r=$('c').parentElement.getBoundingClientRect();ren.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();function box(g,x,y,z,px=0,py=0,pz=0,m=mat){const o=new T.Mesh(new T.BoxGeometry(x,y,z),m);o.position.set(px,py,pz);g.add(o);return o}function extrude(shape,depth,m=mat){return new T.Mesh(new T.ExtrudeGeometry(shape,{depth,bevelEnabled:false,curveSegments:32,steps:1}),m)}function parse(){const p=$('prompt').value.toLowerCase().replace(/,/g,'.'),m=p.match(/(\d+(?:\.\d+)?)\s*[x×]\s*(\d+(?:\.\d+)?)(?:\s*[x×]\s*(\d+(?:\.\d+)?))?/),hit=p.match(/(\d+(?:\.\d+)?)\s*(?:agujeros?|dientes?)/);let type=$('type').value;if(type==='auto')type=/placa|agujero/.test(p)?'plate':/soporte|celular/.test(p)?'stand':/caja/.test(p)?'box':/tubo/.test(p)?'tube':/engranaje|diente/.test(p)?'gear':'box';return{type,w:m?+m[1]:+$('w').value,d:m?+m[2]:+$('d').value,h:m&&m[3]?+m[3]:+$('h').value,t:+$('t').value,n:hit?+hit[1]:+$('n').value}}function rect(w,d){const s=new T.Shape();s.moveTo(-w/2,-d/2);s.lineTo(w/2,-d/2);s.lineTo(w/2,d/2);s.lineTo(-w/2,d/2);s.closePath();return s}function ring(outer,inner){const s=new T.Shape();s.absarc(0,0,outer,0,Math.PI*2);const h=new T.Path();h.absarc(0,0,inner,0,Math.PI*2,true);s.holes.push(h);return s}function build(q){const g=new T.Group();if(q.type==='plate'){const s=rect(q.w,q.d);for(let i=0;i<q.n;i++){const a=i/q.n*Math.PI*2,h=new T.Path();h.absarc(Math.cos(a)*q.w*.32,Math.sin(a)*q.d*.32,Math.min(q.w,q.d)/18,0,Math.PI*2);s.holes.push(h)}const o=extrude(s,q.t);o.rotation.x=-Math.PI/2;g.add(o)}else if(q.type==='tube'){const o=extrude(ring(q.w/2,Math.max(.5,q.w/2-q.t)),q.h);o.rotation.x=-Math.PI/2;g.add(o)}else if(q.type==='box'){box(g,q.w,q.t,q.d,0,q.t/2,0);box(g,q.w,q.t,q.d,0,q.h-q.t/2,0,lidMat);box(g,q.t,q.h,q.d,-q.w/2+q.t/2,q.h/2,0);box(g,q.t,q.h,q.d,q.w/2-q.t/2,q.h/2,0);box(g,q.w-2*q.t,q.h,q.t,0,q.h/2,-q.d/2+q.t/2);box(g,q.w-2*q.t,q.h,q.t,0,q.h/2,q.d/2-q.t/2)}else if(q.type==='stand'){box(g,q.w,q.t,q.d);box(g,q.w,q.t,q.h*.72,0,q.h*.36,q.d*.28);box(g,q.w*.82,q.t*1.5,q.d*.5,0,q.t*.8,0)}else if(q.type==='gear'){const s=new T.Shape(),r=q.w/2;for(let i=0;i<q.n*2;i++){const a=i/(q.n*2)*Math.PI*2,rr=i%2?r:r*.82,x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?s.lineTo(x,y):s.moveTo(x,y)}s.closePath();const o=extrude(s,q.t);o.rotation.x=-Math.PI/2;g.add(o)}else box(g,q.w,q.h,q.d,0,q.h/2,0);return g}function clear(){if(!cur)return;scene.remove(cur);cur.traverse(o=>o.geometry?.dispose())}function frame(g){const b=new T.Box3().setFromObject(g),s=b.getSize(new T.Vector3()),c=b.getCenter(new T.Vector3());g.position.sub(c);const z=Math.max(s.x,s.y,s.z)||1;cam.position.set(z*1.7,z*1.4,z*1.7);ctl.target.set(0,0,0);ctl.update()}$('go').onclick=()=>{try{const q=parse();if(![q.w,q.d,q.h,q.t,q.n].every(Number.isFinite)||q.w<=0||q.d<=0||q.h<=0||q.t<=0||q.n<1)throw Error('Usá medidas positivas.');clear();cur=build(q);scene.add(cur);frame(cur);$('stl').disabled=false;$('status').textContent='Generado: '+q.type+' · '+q.w+'×'+q.d+'×'+q.h+' mm'}catch(e){$('status').textContent='Error: '+e.message}};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.p;$('type').value='auto'});$('stl').onclick=()=>{if(!cur)return;const out=['solid gemelos3d'];cur.updateMatrixWorld(true);cur.traverse(o=>{if(!o.isMesh)return;let g=o.geometry.clone().toNonIndexed();g.applyMatrix4(o.matrixWorld);const p=g.attributes.position;for(let i=0;i+2<p.count;i+=3){const a=new T.Vector3().fromBufferAttribute(p,i),b=new T.Vector3().fromBufferAttribute(p,i+1),c=new T.Vector3().fromBufferAttribute(p,i+2),n=new T.Vector3().subVectors(b,a).cross(new T.Vector3().subVectors(c,a)).normalize();out.push('facet normal '+n.x+' '+n.y+' '+n.z+'\nouter loop\nvertex '+a.x+' '+a.y+' '+a.z+'\nvertex '+b.x+' '+b.y+' '+b.z+'\nvertex '+c.x+' '+c.y+' '+c.z+'\nendloop\nendfacet')}});out.push('endsolid gemelos3d');const u=URL.createObjectURL(new Blob([out.join('\n')],{type:'model/stl'})),a=document.createElement('a');a.href=u;a.download='gemelos3d.stl';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};function loop(){requestAnimationFrame(loop);ren.render(scene,cam)}loop();</script></body></html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemelos 3D — Crear con IA</title>
<style>body{margin:0;background:#0b0f16;color:#eef2f7;font:14px system-ui;padding:24px}main{max-width:1100px;margin:auto}textarea{width:100%;min-height:130px;box-sizing:border-box;background:#121a25;color:white;border:1px solid #354256;border-radius:12px;padding:14px;font:inherit}button{padding:11px 16px;border-radius:10px;border:1px solid #526176;background:#182333;color:white;font-weight:700;cursor:pointer;margin:8px 6px 0 0}.primary{background:#eef3f8;color:#0b0f16}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{border:1px solid #293548;border-radius:16px;padding:18px;background:#111925}.preview{height:430px;position:relative}.preview canvas{width:100%;height:100%}.status{margin-top:12px;color:#9eacbf}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chip{font-size:12px;padding:8px 10px}@media(max-width:800px){.layout{grid-template-columns:1fr}.preview{height:340px}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}</script>
</head><body><main><h1>De una idea a un modelo 3D</h1><p>Describí una caja, cilindro, esfera, soporte o texto. La forma se interpreta según tu pedido; no se crea una caja por defecto.</p><div class="layout"><section class="panel"><h2>¿Qué querés fabricar?</h2><textarea id="prompt" placeholder="Ej.: Gemelos3D en letra gótica, un cilindro de 40 mm de diámetro y 20 mm de alto..."></textarea><div class="chips"><button class="chip" data-p="una caja de 80 x 50 x 30 mm">Caja</button><button class="chip" data-p="un cilindro de 40 mm de diámetro y 20 mm de alto">Cilindro</button><button class="chip" data-p="una esfera de 30 mm">Esfera</button><button class="chip" data-p="Gemelos3D en letra gótica">Texto</button></div><button class="primary" id="generate">Crear modelo 3D →</button><button id="clear">Limpiar</button><div class="status" id="status">Listo. Escribí una idea.</div></section><section class="panel preview"><canvas id="canvas"></canvas></section></div></main>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{FontLoader}from'three/addons/loaders/FontLoader.js';import{TextGeometry}from'three/addons/geometries/TextGeometry.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.1,2000),renderer=new THREE.WebGLRenderer({canvas:$('canvas'),antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x334155,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,6,8);scene.add(light);let current=null;
function resize(){const r=$('canvas').parentElement.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function clear(){if(current){scene.remove(current);current.traverse(o=>{o.geometry?.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose())}});current=null}camera.position.set(4,3,5);controls.target.set(0,0,0);controls.update()}
function dims(s){const n=[...s.matchAll(/(\d+(?:[.,]\d+)?)\s*(?:mm|cm)?/gi)].map(m=>Number(m[1].replace(',','.')));return[n[0]||80,n[1]||50,n[2]||30]}
function make(prompt){const p=prompt.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const mat=new THREE.MeshStandardMaterial({color:0x63b3ed,metalness:.15,roughness:.42});let obj,type;
if(/\b(caja|cubo|prisma|box)\b/.test(p)){const[d,w,h]=dims(p);obj=new THREE.Mesh(new THREE.BoxGeometry(d/40,w/40,h/40),mat);type='caja'}else if(/\b(cilindro|tubo)\b/.test(p)){const[d,h]=dims(p);obj=new THREE.Mesh(new THREE.CylinderGeometry((d/2)/40,(d/2)/40,h/40,64),mat);type='cilindro'}else if(/\b(esfera|bola|pelota)\b/.test(p)){const[d]=dims(p);obj=new THREE.Mesh(new THREE.SphereGeometry((d/2)/40,48,32),mat);type='esfera'}else if(/\b(texto|letra|letras|cartel|logo|gotica)\b/.test(p)){type='texto';const text=prompt.match(/(?:texto|que diga|con el texto)\s+(.+)/i)?.[1]||prompt.replace(/en letra.*$/i,'').trim();obj=new THREE.Group();const plate=new THREE.Mesh(new THREE.BoxGeometry(3.6,.18,1.1),new THREE.MeshStandardMaterial({color:0x334155}));plate.position.y=-.15;obj.add(plate);new FontLoader().load('https://cdn.jsdelivr.net/npm/three@0.161.0/examples/fonts/helvetiker_bold.typeface.json',font=>{const geo=new TextGeometry(text.slice(0,32),{font,size:.42,height:.12,curveSegments:8,bevelEnabled:true,bevelThickness:.02,bevelSize:.01});geo.center();const t=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xf8fafc}));t.rotation.x=-Math.PI/2;obj.add(t);});}else{throw new Error('No reconocí una forma compatible. Probá: caja, cilindro, esfera, soporte o texto.');}return{obj,type}}
function frame(obj){const box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());obj.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;camera.position.set(max*1.8,max*1.4,max*1.8);camera.near=max/100;camera.far=max*100;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.update()}
$('generate').onclick=()=>{const prompt=$('prompt').value.trim();if(!prompt){$('status').textContent='Escribí una descripción primero.';return}try{clear();const r=make(prompt);current=r.obj;scene.add(current);frame(current);$('status').textContent='Modelo generado: '+r.type+'.';}catch(e){$('status').textContent=e.message)}}
$('clear').onclick=()=>{clear();$('prompt').value='';$('status').textContent='Listo. Escribí una idea.'};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.p});
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
</script></body></html>

<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mis proyectos — Gemelos 3D</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#07090d;--panel:#0e1219;--line:#252c38;--muted:#8d97a7;--text:#f5f7fb;--accent:#8bf0c5;--accent2:#8fb7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 420px at 80% -10%,#17243a 0%,transparent 62%),radial-gradient(700px 420px at 5% 15%,#10251f 0%,transparent 58%),var(--bg);color:var(--text);min-height:100vh}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #ffffff12;background:#080b10cc;backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border:1px solid #ffffff24;border-radius:11px;background:linear-gradient(145deg,#17252c,#0d1118);display:grid;place-items:center;font-size:19px}.brand strong{font-size:15px}.brand small{display:block;margin-top:2px;color:#7e8999;font-size:10px}.nav{display:flex;gap:7px}.nav a{padding:9px 12px;text-decoration:none;border:1px solid var(--line);border-radius:9px;color:#cdd5e0;background:#10151d;font-size:11px}.page{max-width:1180px;margin:auto;padding:48px 22px 70px}.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:25px}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:12px}.hero h1{margin:0;font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:-.045em}.hero p{max-width:650px;margin:13px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.hero-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.primary,.clear{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#f5f7fa;color:#0b0d11;cursor:pointer;font-weight:750;font-size:11px;text-decoration:none}.clear{background:#10151d;color:#cdd5e0}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:8px;align-items:center;margin:0 0 13px}.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#0d1118;color:#fff;outline:none;font:inherit;font-size:11px}.search:focus{border-color:#8bf0c555;box-shadow:0 0 0 3px #8bf0c50b}.select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#10151d;color:#cdd5e0;font-size:10px}.count{font-size:10px;color:#687486;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{position:relative;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#10151d,#0d1118);padding:17px;min-height:218px;display:flex;flex-direction:column;overflow:hidden;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#ffffff35;box-shadow:0 18px 45px #0005}.card:after{content:"";position:absolute;width:110px;height:110px;right:-55px;bottom:-55px;border-radius:50%;background:#8bf0c50b}.source{font-size:9px;color:#758194;text-transform:uppercase;letter-spacing:.12em}.name{font-size:17px;font-weight:750;margin:8px 0}.info{font-size:11px;color:#919baa;line-height:1.6;flex:1}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pill{padding:5px 7px;border-radius:6px;background:#171e28;color:#8994a5;font-size:9px}.status{display:inline-flex;align-self:flex-start;margin-top:11px;padding:5px 8px;border-radius:6px;background:#8bf0c510;color:var(--accent);font-size:9px;font-weight:700}.actions{display:flex;gap:7px;margin-top:14px}.actions a,.actions button{flex:1;text-align:center;border:1px solid #343b47;background:#f5f7fa;color:#0b0d11;border-radius:8px;padding:9px;font-size:10px;font-weight:750;text-decoration:none;cursor:pointer}.actions .secondary{background:#171d27;color:#fff}.empty{grid-column:1/-1;padding:38px;border:1px dashed #303846;border-radius:16px;text-align:center;background:#0d1118}.empty-icon{font-size:30px;margin-bottom:12px}.empty strong{display:block;font-size:16px}.empty p{margin:7px auto 16px;color:var(--muted);font-size:11px;max-width:430px;line-height:1.5}.empty-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.empty-actions a{padding:9px 12px;border-radius:8px;text-decoration:none;background:#f5f7fa;color:#0b0d11;font-size:10px;font-weight:750}.empty-actions a.secondary{background:#171d27;color:#fff;border:1px solid #343b47}.no-results{grid-column:1/-1;padding:34px;text-align:center;border:1px solid var(--line);border-radius:16px;color:var(--muted);font-size:11px;background:#0d1118}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.count{grid-column:1/-1}}@media(max-width:560px){header{padding:0 14px}.page{padding:34px 14px 50px}.hero{grid-template-columns:1fr}.hero-actions{justify-content:flex-start}.nav a:first-child{display:none}.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.count{grid-column:auto}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">◇</div><div><strong>Gemelos 3D</strong><small>Workspace · Mis proyectos</small></div></div><nav class="nav"><a href="./">← Inicio</a><a href="./crear-ia.html">＋ Nuevo proyecto</a></nav></header>
<main class="page">
<section class="hero"><div><div class="eyebrow">Biblioteca local</div><h1>Mis proyectos.</h1><p>Continuá tus diseños, recuperá modelos guardados y volvé al Taller cuando quieras. Todo queda almacenado localmente en este dispositivo.</p></div><div class="hero-actions"><a class="primary" href="./crear-ia.html">✦ Crear con IA</a><a class="clear" href="./importar-modelo.html">↥ Importar</a><button id="clear" class="clear">Borrar todos</button></div></section>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="Buscar por nombre, modelo o origen…" autocomplete="off"><select id="source" class="select"><option value="all">Todos los orígenes</option><option value="ai">IA</option><option value="import">Importados</option><option value="svg">SVG</option><option value="manual">Manual</option></select><select id="sort" class="select"><option value="recent">Más recientes</option><option value="name">Nombre A–Z</option><option value="size">Mayor tamaño</option></select></div>
<div class="toolbar"><span id="count" class="count">Cargando…</span></div>
<section id="grid" class="grid"></section>
</main>
<script type="module">
import {loadProjects,deleteProject,clearProjects,setActiveProject} from './src/project/project-storage.js';
const grid=document.querySelector('#grid'),count=document.querySelector('#count'),search=document.querySelector('#search'),source=document.querySelector('#source'),sort=document.querySelector('#sort');
let projects=[];
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sizeOf(p){const d=p.model?.dimensions||{};return Number(d.width||0)*Number(d.height||0)*Number(d.depth||0)}
function sourceLabel(v){return ({ai:'IA',import:'Importado',svg:'SVG',manual:'Manual'})[v]||v||'Proyecto'}
function render(){const q=search.value.trim().toLowerCase(),s=source.value;let list=projects.filter(p=>{const hay=[p.name,p.model?.name,p.source,p.workflow?.current].join(' ').toLowerCase();return(!q||hay.includes(q))&&(s==='all'||p.source===s)});if(sort.value==='name')list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));else if(sort.value==='size')list.sort((a,b)=>sizeOf(b)-sizeOf(a));else list.sort((a,b)=>new Date(b.updatedAt||b.createdAt||0)-new Date(a.updatedAt||a.createdAt||0));grid.innerHTML='';count.textContent=projects.length?`${list.length} de ${projects.length} proyecto${projects.length===1?'':'s'} mostrado${list.length===1?'':'s'}`:'Todavía no hay proyectos guardados.';if(!projects.length){grid.innerHTML='<div class="empty"><div class="empty-icon">◇</div><strong>Tu biblioteca está vacía</strong><p>Creá un modelo, convertí un SVG o importá un archivo para empezar a construir tu biblioteca de proyectos.</p><div class="empty-actions"><a href="./crear-ia.html">Crear con IA</a><a class="secondary" href="./importar-modelo.html">Importar modelo</a></div></div>';return}if(!list.length){grid.innerHTML='<div class="no-results">No encontramos proyectos con esos filtros. Probá con otra búsqueda.</div>';return}list.forEach(p=>{const d=p.model?.dimensions||{};const card=document.createElement('article');card.className='card';const dims=d.width?`${Number(d.width).toFixed(1)} × ${Number(d.height||0).toFixed(1)} × ${Number(d.depth||0).toFixed(1)} mm`:'Dimensiones pendientes';card.innerHTML=`<div class="source">${esc(sourceLabel(p.source))}</div><div class="name">${esc(p.name||'Proyecto sin nombre')}</div><div class="info">${esc(p.model?.name||'Modelo')}<br>${dims}</div><div class="meta"><span class="pill">${esc(p.workflow?.current||'crear')}</span><span class="pill">${p.updatedAt?'Actualizado':'Guardado'}</span></div><span class="status">● Listo para continuar</span><div class="actions"><a href="./app.html?project=${encodeURIComponent(p.id)}" data-open="${esc(p.id)}">Continuar</a><button class="secondary">Eliminar</button></div>`;grid.appendChild(card);card.querySelector('[data-open]').onclick=()=>setActiveProject(p.id);card.querySelector('button').onclick=()=>{if(confirm(`¿Eliminar “${p.name||'este proyecto'}”?`)){deleteProject(p.id);projects=loadProjects();render()}}})}
search.oninput=render;source.onchange=render;sort.onchange=render;document.querySelector('#clear').onclick=()=>{if(projects.length&&confirm('¿Borrar todos los proyectos de este dispositivo?')){clearProjects();projects=[];render()}};projects=loadProjects();render();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mis proyectos — Gemelos 3D</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#07090d;--panel:#0e1219;--panel2:#121722;--line:#252c38;--muted:#8d97a7;--text:#f5f7fb;--accent:#8bf0c5;--accent2:#8fb7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 420px at 80% -10%,#17243a 0%,transparent 62%),radial-gradient(700px 420px at 5% 15%,#10251f 0%,transparent 58%),var(--bg);color:var(--text);min-height:100vh}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #ffffff12;background:#080b10cc;backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border:1px solid #ffffff24;border-radius:11px;background:linear-gradient(145deg,#17252c,#0d1118);display:grid;place-items:center;font-size:19px}.brand strong{font-size:15px}.brand small{display:block;margin-top:2px;color:#7e8999;font-size:10px}.back{padding:9px 12px;text-decoration:none;border:1px solid var(--line);border-radius:9px;color:#cdd5e0;background:#10151d;font-size:11px}.page{max-width:1180px;margin:auto;padding:48px 22px 70px}.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:25px}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:12px}.hero h1{margin:0;font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:-.045em}.hero p{max-width:650px;margin:13px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.clear{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#10151d;color:#cdd5e0;cursor:pointer;font-weight:650;font-size:11px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 13px}.count{font-size:10px;color:#687486}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{position:relative;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#10151d,#0d1118);padding:17px;min-height:205px;display:flex;flex-direction:column;overflow:hidden;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#ffffff35;box-shadow:0 18px 45px #0005}.card:after{content:"";position:absolute;width:110px;height:110px;right:-55px;bottom:-55px;border-radius:50%;background:#8bf0c50b}.source{font-size:9px;color:#758194;text-transform:uppercase;letter-spacing:.12em}.name{font-size:17px;font-weight:750;margin:8px 0}.info{font-size:11px;color:#919baa;line-height:1.6;flex:1}.status{display:inline-flex;align-self:flex-start;margin-top:11px;padding:5px 8px;border-radius:6px;background:#8bf0c510;color:var(--accent);font-size:9px;font-weight:700}.actions{display:flex;gap:7px;margin-top:14px}.actions a,.actions button{flex:1;text-align:center;border:1px solid #343b47;background:#f5f7fa;color:#0b0d11;border-radius:8px;padding:9px;font-size:10px;font-weight:750;text-decoration:none;cursor:pointer}.actions .secondary{background:#171d27;color:#fff}.empty{grid-column:1/-1;padding:38px;border:1px dashed #303846;border-radius:16px;text-align:center;background:#0d1118}.empty-icon{font-size:30px;margin-bottom:12px}.empty strong{display:block;font-size:16px}.empty p{margin:7px auto 16px;color:var(--muted);font-size:11px;max-width:430px;line-height:1.5}.empty-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.empty-actions a{padding:9px 12px;border-radius:8px;text-decoration:none;background:#f5f7fa;color:#0b0d11;font-size:10px;font-weight:750}.empty-actions a.secondary{background:#171d27;color:#fff;border:1px solid #343b47}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){header{padding:0 14px}.page{padding:34px 14px 50px}.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;gap:8px;flex-direction:column}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">◇</div><div><strong>Gemelos 3D</strong><small>Workspace · Mis proyectos</small></div></div><a class="back" href="./">← Inicio</a></header>
<main class="page">
<section class="hero"><div><div class="eyebrow">Biblioteca local</div><h1>Mis proyectos.</h1><p>Continuá tus diseños, recuperá modelos guardados y volvé al Taller cuando quieras. Todo queda almacenado localmente en este dispositivo.</p></div><button id="clear" class="clear">Borrar todos</button></section>
<div class="toolbar"><span id="count" class="count">Cargando…</span></div>
<section id="grid" class="grid"></section>
</main>
<script type="module">
import {loadProjects,deleteProject,clearProjects,setActiveProject} from './src/project/project-storage.js';
const grid=document.querySelector('#grid'),count=document.querySelector('#count');
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const projects=loadProjects();grid.innerHTML='';count.textContent=projects.length?`${projects.length} proyecto${projects.length===1?'':'s'} guardado${projects.length===1?'':'s'} localmente`:'Todavía no hay proyectos guardados.';if(!projects.length){grid.innerHTML='<div class="empty"><div class="empty-icon">◇</div><strong>Tu biblioteca está vacía</strong><p>Creá un modelo, convertí un SVG o importá un archivo para empezar a construir tu biblioteca de proyectos.</p><div class="empty-actions"><a href="./crear-ia.html">Crear con IA</a><a class="secondary" href="./importar-modelo.html">Importar modelo</a></div></div>';return}projects.forEach(p=>{const d=p.model?.dimensions||{};const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="source">${esc(p.source||'proyecto')}</div><div class="name">${esc(p.name||'Proyecto sin nombre')}</div><div class="info">${esc(p.model?.name||'Modelo')}<br>${d.width?`${Number(d.width).toFixed(1)} × ${Number(d.height||0).toFixed(1)} × ${Number(d.depth||0).toFixed(1)} mm`:'Dimensiones pendientes'}</div><span class="status">Paso · ${esc(p.workflow?.current||'crear')}</span><div class="actions"><a href="./app.html?project=${encodeURIComponent(p.id)}" data-open="${esc(p.id)}">Continuar</a><button class="secondary">Eliminar</button></div>`;grid.appendChild(card);card.querySelector('[data-open]').onclick=()=>setActiveProject(p.id);card.querySelector('button').onclick=()=>{if(confirm(`¿Eliminar “${p.name||'este proyecto'}”?`)){deleteProject(p.id);render()}}})}
document.querySelector('#clear').onclick=()=>{if(confirm('¿Borrar todos los proyectos de este dispositivo?')){clearProjects();render()}};render();
</script>
</body>
</html>

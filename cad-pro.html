<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemelos3D — CAD Pro</title>
<style>body{margin:0;background:#081018;color:#edf6ff;font:14px system-ui;padding:18px}main{max-width:1200px;margin:auto}h1{margin:0 0 6px}p{color:#9eb1c7}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px}.panel{background:#101b29;border:1px solid #2b4058;border-radius:16px;padding:16px}.field{margin:10px 0}.field label{display:block;color:#a8bdd2;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;background:#0a1420;color:#fff;border:1px solid #38506a;border-radius:9px;box-sizing:border-box}button{padding:10px 12px;border-radius:9px;border:1px solid #536b86;background:#1a2b40;color:#fff;font-weight:700;cursor:pointer;margin:4px 3px 0 0}.primary{background:#c9f27b;color:#14200c;border-color:#c9f27b}.preview{min-height:560px;padding:0;overflow:hidden}.preview canvas{width:100%;height:100%;min-height:560px;display:block}.status{color:#a9bdd2;line-height:1.5;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.spec{margin-top:12px;padding:10px;background:#0a1420;border-radius:10px;color:#c9f27b}@media(max-width:800px){.layout{grid-template-columns:1fr}.preview,.preview canvas{min-height:380px}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}</script></head><body><main><h1>Laboratorio CAD Pro</h1><p>Modelos funcionales paramétricos con operaciones de construcción y exportación STL.</p><div class="layout"><section class="panel"><div class="field"><label>Plantilla</label><select id="kind"><option value="stand">Soporte para celular</option><option value="box">Caja con tapa</option><option value="plate">Placa con agujeros reales</option><option value="tube">Tubo perforado</option><option value="gear">Engranaje</option><option value="hook">Gancho</option></select></div><div class="grid"><div class="field"><label>Ancho mm</label><input id="w" type="number" value="80" min="5"></div><div class="field"><label>Profundidad mm</label><input id="d" type="number" value="70" min="5"></div><div class="field"><label>Alto mm</label><input id="h" type="number" value="100" min="5"></div><div class="field"><label>Espesor mm</label><input id="t" type="number" value="4" min="1"></div></div><div class="field"><label>Agujeros / dientes</label><input id="n" type="number" value="6" min="2" max="48"></div><button class="primary" id="make">Construir modelo</button><button id="export" disabled>Exportar STL</button><button id="reset">Restablecer</button><div class="status" id="status">Listo para construir.</div><div class="spec" id="spec">Dimensiones: —</div></section><section class="panel preview"><canvas id="canvas"></canvas></section></div></main>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.1,10000),renderer=new THREE.WebGLRenderer({canvas:$('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));scene.add(new THREE.HemisphereLight(0xffffff,0x243447,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(5,8,7);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let root=null;
function resize(){const r=$('canvas').parentElement.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();const material=()=>new THREE.MeshStandardMaterial({color:0x78c9ff,roughness:.32,metalness:.15});
function mesh(g,geo,mat=material(),x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);g.add(m);return m}function solid(g,w,h,d,y=0){return mesh(g,new THREE.BoxGeometry(w,h,d),material(),0,y,0)}
function plateWithHoles(w,d,t,n){const shape=new THREE.Shape();shape.moveTo(-w/2,-d/2);shape.lineTo(w/2,-d/2);shape.lineTo(w/2,d/2);shape.lineTo(-w/2,d/2);shape.closePath();for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const x=Math.cos(a)*w*.32,z=Math.sin(a)*d*.32;const hole=new THREE.Path();hole.absellipse(x,z,Math.min(w,d)/18,Math.min(w,d)/18,0,Math.PI*2,false,0);shape.holes.push(hole)}const geo=new THREE.ExtrudeGeometry(shape,{depth:t,bevelEnabled:false});geo.rotateX(-Math.PI/2);return geo}
function build(){const k=$('kind').value,w=+$('w').value,d=+$('d').value,h=+$('h').value,t=+$('t').value,n=+$('n').value,g=new THREE.Group();if(k==='stand'){solid(g,w,t,d,t/2);const back=solid(g,w,h*.75,t,h*.375);back.rotation.x=-.28;back.position.z=d*.28;solid(g,w*.82,t*1.5,d*.48,t*1.3)}else if(k==='box'){solid(g,w,t,d,t/2);solid(g,w,t,d,h-t/2);solid(g,t,h,d);solid(g,t,h,d,w/2-t/2);solid(g,w-2*t,h,t,-d/2+t/2);solid(g,w-2*t,h,t,d/2-t/2);solid(g,w-2*t,t,d-2*t,h-t/2)}else if(k==='plate'){mesh(g,plateWithHoles(w,d,t,n))}else if(k==='tube'){mesh(g,new THREE.CylinderGeometry(w/2,w/2,h,64));mesh(g,new THREE.CylinderGeometry(Math.max(1,w/2-t),Math.max(1,w/2-t),h+.5,64),new THREE.MeshStandardMaterial({color:0x263b50}))}else if(k==='gear'){const s=new THREE.Shape(),r=w/2;for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,rr=i%2?r:r*.82,x=Math.cos(a)*rr,z=Math.sin(a)*rr;i?s.lineTo(x,z):s.moveTo(x,z)}s.closePath();const geo=new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:false});geo.rotateX(-Math.PI/2);mesh(g,geo);mesh(g,new THREE.CylinderGeometry(r*.2,r*.2,t+.2,48),new THREE.MeshStandardMaterial({color:0x263b50}))}else if(k==='hook'){solid(g,t,h,t,t/2);solid(g,w*.65,t,t,h-t/2);solid(g,t,h*.55,t,h/2,w*.3)}return g}
function frame(){const b=new THREE.Box3().setFromObject(root),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());root.position.sub(c);const max=Math.max(s.x,s.y,s.z)||1;camera.position.set(max*1.8,max*1.4,max*1.8);camera.near=max/1000;camera.far=max*30;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.update();$('spec').textContent=`Dimensiones: ${s.x.toFixed(1)} × ${s.y.toFixed(1)} × ${s.z.toFixed(1)} mm`}
function clear(){if(root){scene.remove(root);root.traverse(o=>{o.geometry?.dispose();if(o.material)o.material.dispose()});root=null}$('export').disabled=true}
$('make').onclick=()=>{try{clear();root=build();scene.add(root);frame();$('status').textContent='Modelo construido con geometría paramétrica.';$('export').disabled=false}catch(e){$('status').textContent='Error: '+e.message}};$('reset').onclick=()=>{clear();$('status').textContent='Listo para construir.';$('spec').textContent='Dimensiones: —'};
$('export').onclick=()=>{if(!root)return;const facets=[];root.updateMatrixWorld(true);root.traverse(o=>{if(!o.isMesh)return;const g=o.geometry.clone();g.applyMatrix4(o.matrixWorld);const p=g.attributes.position;for(let i=0;i<p.count;i+=3){const a=new THREE.Vector3().fromBufferAttribute(p,i),b=new THREE.Vector3().fromBufferAttribute(p,i+1),c=new THREE.Vector3().fromBufferAttribute(p,i+2),n=new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3().subVectors(c,a)).normalize();facets.push(`facet normal ${n.x} ${n.y} ${n.z}\n outer loop\n  vertex ${a.x} ${a.y} ${a.z}\n  vertex ${b.x} ${b.y} ${b.z}\n  vertex ${c.x} ${c.y} ${c.z}\n endloop\nendfacet`)}});const blob=new Blob(['solid gemelos3d\n'+facets.join('\n')+'\nendsolid gemelos3d'],{type:'model/stl'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gemelos3d-cad-pro.stl';a.click();$('status').textContent='STL exportado.'};
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
</script></body></html>
